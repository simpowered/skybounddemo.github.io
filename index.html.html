<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYBOUND: GD EDITION</title>
    <style>
        body {
            margin: 0;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Verdana', sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 60px rgba(0, 255, 200, 0.2);
            border: 3px solid #333;
            cursor: default;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
/**
 * -------------------------------------------------------
 *  PROJECT: SKYBOUND - GEOMETRY DASH EDITION v2
 *  UPDATE: Extended Level 2 (Cube/Ship Mix)
 * -------------------------------------------------------
 */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// --- DATA & ASSETS ---

const SKINS = {
    CUBES: [
        { name: "CLASSIC", color: "#00CED1", eye: "#FFF" }, // Teal
        { name: "IGNITE",  color: "#FF4500", eye: "#FFD700" }, // Red
        { name: "TOXIC",   color: "#32CD32", eye: "#000" }, // Green
        { name: "VOID",    color: "#8A2BE2", eye: "#FFF" }  // Purple
    ],
    SHIPS: [
        { name: "ROCKET",  color: "#FF0055", eye: "#FFF" },
        { name: "UFO",     color: "#00FFFF", eye: "#000" },
        { name: "SHARK",   color: "#777777", eye: "#F00" }
    ]
};

const LEVELS = [
    {
        title: "1. THE GAUNTLET",
        desc: "1 Minute. No Mercy.",
        mode: "RUNNER",
        bg: "#20002c", 
        groundCol: "#3b0052",
        groundY: 400,
        speed: 9.5,
        len: 34200, // ~60s
        difficulty: "DEMON"
    },
    {
        title: "2. AERO DYNAMICS",
        desc: "Ship & Cube Mix.",
        mode: "RUNNER",
        bg: "#001f3f", 
        groundCol: "#003366",
        groundY: 400,
        speed: 8.5,
        len: 30000, // Extended to ~60s
        difficulty: "HARD"
    }
];

// --- STATE VARIABLES ---

let gameState = "MENU"; 
let menuTab = "CUBE";
let levelIdx = 0;
let cubeIdx = 0;
let shipIdx = 0;

let player = { 
    x: 100, y: 0, w: 30, h: 30, 
    vx: 0, vy: 0, 
    mode: "CUBE", 
    grounded: false,
    rot: 0 
};

let cam = { x: 0 };
let shake = 0;
let particles = [];

let obstacles = [];
let portals = [];
let decorative = [];

// --- INPUT ---

const keys = {};
const mouse = { x: 0, y: 0, click: false };

window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "ArrowUp") handleInput();
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", () => {
    mouse.click = true;
    if (gameState === "MENU") handleMenuClick();
    else handleInput(); 
});
canvas.addEventListener("mouseup", () => mouse.click = false);

function handleInput() {
    if (gameState === "DEAD" || gameState === "WIN") {
        if (gameState === "WIN") gameState = "MENU";
        else initLevel(levelIdx);
        return;
    }

    if (gameState === "PLAY") {
        if (player.mode === "CUBE" && player.grounded) {
            player.vy = -16; 
            player.grounded = false;
            playSound("jump");
            spawnParticles(player.x, player.y + 30, 5, "#FFF");
        }
    }
}

// --- AUDIO ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === "jump") {
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === "hit") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === "click") {
        osc.type = "square";
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    }
}

// --- CORE GAME LOGIC ---

function initLevel(idx) {
    levelIdx = idx;
    const lvl = LEVELS[idx];
    gameState = "PLAY";
    
    // Reset
    player.x = 100; player.y = 200; player.vy = 0; player.mode = "CUBE"; player.rot = 0;
    cam.x = 0;
    obstacles = [];
    portals = [];
    particles = [];
    
    let xPos = 800; 

    // --- LEVEL 1: THE GAUNTLET ---
    if (idx === 0) {
        while (xPos < lvl.len) {
            let gap = Math.random() * 200 + 250; 
            xPos += gap;
            if (Math.random() > 0.7) {
                obstacles.push({ x: xPos, y: lvl.groundY - 30, w: 60, h: 30, type: "SPIKE" });
            } else {
                obstacles.push({ x: xPos, y: lvl.groundY - 30, w: 30, h: 30, type: "SPIKE" });
            }
            if (Math.random() > 0.85) {
                xPos += 200;
                obstacles.push({ x: xPos, y: lvl.groundY - 60, w: 50, h: 60, type: "BLOCK" });
                if (Math.random() > 0.5) {
                    obstacles.push({ x: xPos + 10, y: lvl.groundY - 90, w: 30, h: 30, type: "SPIKE" });
                }
            }
        }
    } 
    // --- LEVEL 2: AERO DYNAMICS (EXTENDED) ---
    else {
        // SECTION 1: CUBE INTRO (0 - 3000)
        while (xPos < 3000) {
            xPos += 400;
            obstacles.push({ x: xPos, y: lvl.groundY - 30, w: 30, h: 30, type: "SPIKE" });
        }

        // PORTAL: SHIP
        xPos += 400;
        portals.push({ x: xPos, y: 250, w: 50, h: 150, type: "SHIP" });
        xPos += 300;

        // SECTION 2: SHIP FLIGHT (3500 - 10000)
        while (xPos < 10000) {
            xPos += 600;
            // Wide gaps for beginner ship
            obstacles.push({ x: xPos, y: 0, w: 60, h: 100, type: "HANGING" }); // Ceiling
            obstacles.push({ x: xPos + 300, y: lvl.groundY - 100, w: 60, h: 100, type: "BLOCK" }); // Floor
        }

        // PORTAL: CUBE
        xPos += 500;
        portals.push({ x: xPos, y: 250, w: 50, h: 150, type: "CUBE" });
        xPos += 300;

        // SECTION 3: CUBE PLATFORMING (11000 - 18000)
        while (xPos < 18000) {
            xPos += 350;
            obstacles.push({ x: xPos, y: lvl.groundY - 40, w: 40, h: 40, type: "BLOCK" });
            // Jump over spike onto block
            if (Math.random() > 0.5) {
               obstacles.push({ x: xPos - 150, y: lvl.groundY - 30, w: 30, h: 30, type: "SPIKE" }); 
            }
        }

        // PORTAL: SHIP (HARDER)
        xPos += 400;
        portals.push({ x: xPos, y: 200, w: 50, h: 150, type: "SHIP" });
        xPos += 300;

        // SECTION 4: THE TUNNEL (19000 - 26000)
        while (xPos < 26000) {
            xPos += 500;
            let tunnelH = 180; 
            let tunnelY = 100 + Math.random() * 100; // Varied height
            
            // Top block
            obstacles.push({ x: xPos, y: 0, w: 80, h: tunnelY, type: "HANGING" });
            // Bottom block
            obstacles.push({ x: xPos, y: tunnelY + tunnelH, w: 80, h: 500, type: "BLOCK" });
        }

        // PORTAL: CUBE (FINAL SPRINT)
        xPos += 500;
        portals.push({ x: xPos, y: 250, w: 50, h: 150, type: "CUBE" });
        xPos += 400;

        // SECTION 5: FINAL CUBE (27000 - END)
        while (xPos < lvl.len - 500) {
            xPos += 300;
            // Triple spikes rare, doubles common
            obstacles.push({ x: xPos, y: lvl.groundY - 30, w: 30, h: 30, type: "SPIKE" });
            obstacles.push({ x: xPos + 30, y: lvl.groundY - 30, w: 30, h: 30, type: "SPIKE" });
        }
    }
}

function update() {
    if (gameState !== "PLAY") return;

    const lvl = LEVELS[levelIdx];
    cam.x += lvl.speed;
    player.x = cam.x + 150;

    // PHYSICS
    if (player.mode === "CUBE") {
        player.vy += 0.9; 
        if (!player.grounded) player.rot += 0.15;
        else player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2); 
    } 
    else if (player.mode === "SHIP") {
        if (keys["Space"] || keys["ArrowUp"] || mouse.click) player.vy -= 0.6; 
        else player.vy += 0.6;
        player.vy = Math.max(-8, Math.min(8, player.vy));
        player.rot = player.vy * 0.1;
    }

    player.y += player.vy;
    player.grounded = false;

    // GROUND
    if (player.y + player.h >= lvl.groundY) {
        player.y = lvl.groundY - player.h;
        if (player.mode === "CUBE") {
            player.vy = 0;
            player.grounded = true;
        } else {
            player.vy = 0; // Ship slides
        }
    }
    // CEILING (SHIP)
    if (player.y < 0) {
        player.y = 0;
        player.vy = 0;
    }

    // COLLISIONS
    for (let o of obstacles) {
        if (o.x < cam.x - 100 || o.x > cam.x + WIDTH + 100) continue;

        if (player.x < o.x + o.w - 8 && player.x + player.w > o.x + 8 &&
            player.y < o.y + o.h - 8 && player.y + player.h > o.y + 8) {
            
            // Block Landing (Cube)
            if (o.type === "BLOCK" && player.vy > 0 && player.y + player.h < o.y + 25 && player.mode === "CUBE") {
                player.y = o.y - player.h;
                player.vy = 0;
                player.grounded = true;
            } else {
                die();
            }
        }
    }

    // PORTALS
    for (let p of portals) {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            
            if (p.type === "SHIP" && player.mode !== "SHIP") {
                player.mode = "SHIP";
                spawnParticles(player.x, player.y, 20, "#FF00FF");
                playSound("jump");
            }
            else if (p.type === "CUBE" && player.mode !== "CUBE") {
                player.mode = "CUBE";
                spawnParticles(player.x, player.y, 20, "#00FFFF");
                playSound("jump");
            }
        }
    }

    if (player.x > lvl.len) gameState = "WIN";
    if (shake > 0) shake *= 0.9;

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function die() {
    gameState = "DEAD";
    shake = 30;
    playSound("hit");
    spawnParticles(player.x, player.y, 50, "#FFF");
}

function spawnParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
            life: 1.0, color: color
        });
    }
}

// --- RENDERER ---

function draw() {
    if (gameState === "MENU") {
        drawMenu();
        return;
    }

    const lvl = LEVELS[levelIdx];
    ctx.fillStyle = lvl.bg;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    let shakeX = (Math.random() - 0.5) * shake;
    let shakeY = (Math.random() - 0.5) * shake;
    ctx.translate(-cam.x + shakeX, shakeY);

    // Floor
    ctx.fillStyle = lvl.groundCol;
    let floorStart = Math.floor(cam.x / 100) * 100 - 100;
    ctx.fillRect(floorStart, lvl.groundY, WIDTH + 400, HEIGHT - lvl.groundY);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.beginPath(); ctx.moveTo(floorStart, lvl.groundY+5); ctx.lineTo(floorStart+WIDTH+400, lvl.groundY+5); ctx.stroke();

    // Obstacles
    for (let o of obstacles) {
        if (o.x < cam.x - 100 || o.x > cam.x + WIDTH + 100) continue;

        if (o.type === "SPIKE") {
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.moveTo(o.x, o.y + o.h); ctx.lineTo(o.x + o.w/2, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.fill();
            ctx.fillStyle = "#FFF";
            ctx.beginPath(); ctx.moveTo(o.x + 5, o.y + o.h - 2); ctx.lineTo(o.x + o.w/2, o.y + 8); ctx.lineTo(o.x + o.w - 5, o.y + o.h - 2); ctx.fill();
        } 
        else if (o.type === "HANGING") {
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w/2, o.y + o.h); ctx.lineTo(o.x + o.w, o.y); ctx.fill();
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        else { // BLOCK
            ctx.fillStyle = "#000";
            ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.strokeStyle = "#FFF"; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
        }
    }

    // Portals
    for (let p of portals) {
        ctx.fillStyle = p.type === "SHIP" ? "#FF00FF" : "#00FFFF";
        ctx.globalAlpha = 0.7;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.globalAlpha = 1.0;
        ctx.lineWidth = 4; ctx.strokeStyle = "#FFF"; ctx.strokeRect(p.x, p.y, p.w, p.h);
    }

    // Player
    if (gameState !== "DEAD") {
        ctx.save();
        ctx.translate(player.x + player.w/2, player.y + player.h/2);
        ctx.rotate(player.rot);
        
        if (player.mode === "CUBE") {
            ctx.fillStyle = SKINS.CUBES[cubeIdx].color;
            ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
            ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
            ctx.fillStyle = SKINS.CUBES[cubeIdx].eye;
            ctx.fillRect(2, -5, 10, 10); ctx.fillRect(2, -5, 10, 10); 
        } 
        else { // SHIP
            ctx.fillStyle = SKINS.SHIPS[shipIdx].color;
            ctx.beginPath();
            ctx.moveTo(-20, 10); ctx.lineTo(20, 10); ctx.lineTo(25, 0); ctx.lineTo(-10, 0); ctx.lineTo(-20, -10); ctx.fill();
            ctx.fillStyle = SKINS.SHIPS[shipIdx].eye;
            ctx.beginPath(); ctx.arc(5, -5, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = SKINS.CUBES[cubeIdx].color;
            ctx.fillRect(0, -8, 10, 10);
        }
        ctx.restore();
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 6, 6);
        ctx.globalAlpha = 1;
    }

    ctx.restore();

    // UI
    if (gameState === "DEAD") {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#FFF";
        ctx.textAlign = "center";
        ctx.font = "bold 40px Verdana";
        ctx.fillText("CRASHED", WIDTH/2, HEIGHT/2 - 20);
        let pct = Math.floor((player.x / lvl.len) * 100);
        ctx.font = "20px Verdana";
        ctx.fillText("Progress: " + pct + "%", WIDTH/2, HEIGHT/2 + 30);
        ctx.fillText("Click to Retry", WIDTH/2, HEIGHT/2 + 70);
    }
    else if (gameState === "WIN") {
        ctx.fillStyle = "rgba(0,255,0,0.3)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#FFF";
        ctx.textAlign = "center";
        ctx.font = "bold 50px Verdana";
        ctx.fillText("LEVEL COMPLETE", WIDTH/2, HEIGHT/2);
        ctx.font = "20px Verdana";
        ctx.fillText("Click for Menu", WIDTH/2, HEIGHT/2 + 50);
    }
    else {
        ctx.fillStyle = "#FFF";
        ctx.fillRect(20, 20, 200, 10);
        ctx.fillStyle = player.mode === "SHIP" ? "#FF00FF" : "#00CED1";
        let barW = Math.min(200, (player.x / lvl.len) * 200);
        ctx.fillRect(20, 20, barW, 10);
    }
}

function handleMenuClick() {
    const btnW = 250, btnH = 60;
    // Levels
    if (mouse.x > 50 && mouse.x < 50 + btnW) {
        if (mouse.y > 150 && mouse.y < 210) { playSound("click"); initLevel(0); }
        if (mouse.y > 230 && mouse.y < 290) { playSound("click"); initLevel(1); }
    }
    // Tabs
    if (mouse.y > 350 && mouse.y < 390) {
        if (mouse.x > 350 && mouse.x < 450) menuTab = "CUBE";
        if (mouse.x > 470 && mouse.x < 570) menuTab = "SHIP";
    }
    // Icons
    const startX = 350, startY = 410, size = 50;
    const list = menuTab === "CUBE" ? SKINS.CUBES : SKINS.SHIPS;
    for(let i=0; i<list.length; i++) {
        let bx = startX + (i * 60);
        if (mouse.x > bx && mouse.x < bx + size && mouse.y > startY && mouse.y < startY + size) {
            playSound("click");
            if (menuTab === "CUBE") cubeIdx = i; else shipIdx = i;
        }
    }
}

function drawMenu() {
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    
    ctx.textAlign = "left";
    ctx.font = "italic bold 50px Verdana";
    ctx.fillStyle = "#00CED1";
    ctx.fillText("SKYBOUND", 50, 80);
    ctx.font = "20px Verdana";
    ctx.fillStyle = "#666";
    ctx.fillText("GD EDITION", 50, 110);

    const drawLevelBtn = (idx, x, y) => {
        let hover = (mouse.x > x && mouse.x < x+250 && mouse.y > y && mouse.y < y+60);
        ctx.fillStyle = hover ? "#222" : "#111";
        ctx.fillRect(x, y, 250, 60);
        ctx.lineWidth = 2; ctx.strokeStyle = hover ? "#00CED1" : "#333"; ctx.strokeRect(x, y, 250, 60);
        ctx.fillStyle = "#FFF"; ctx.font = "bold 16px Verdana"; ctx.fillText(LEVELS[idx].title, x + 15, y + 25);
        ctx.fillStyle = "#888"; ctx.font = "12px Verdana"; ctx.fillText(LEVELS[idx].desc, x + 15, y + 45);
    };

    drawLevelBtn(0, 50, 150);
    drawLevelBtn(1, 50, 230);

    // Customizer
    ctx.fillStyle = "#151520";
    ctx.fillRect(320, 0, 480, HEIGHT);
    ctx.strokeStyle = "#333"; ctx.beginPath(); ctx.moveTo(320, 0); ctx.lineTo(320, HEIGHT); ctx.stroke();

    // Preview
    ctx.fillStyle = "#000"; ctx.fillRect(450, 100, 120, 120);
    ctx.strokeStyle = "#FFF"; ctx.strokeRect(450, 100, 120, 120);
    
    ctx.save();
    ctx.translate(510, 160);
    ctx.scale(2, 2);
    if (menuTab === "CUBE") {
        ctx.fillStyle = SKINS.CUBES[cubeIdx].color;
        ctx.fillRect(-15, -15, 30, 30);
        ctx.fillStyle = SKINS.CUBES[cubeIdx].eye;
        ctx.fillRect(0, -5, 10, 10);
    } else {
        ctx.fillStyle = SKINS.SHIPS[shipIdx].color;
        ctx.fillRect(-20, -10, 40, 20);
        ctx.fillStyle = SKINS.SHIPS[shipIdx].eye;
        ctx.fillRect(0, -5, 10, 10);
    }
    ctx.restore();

    // Tabs
    ctx.textAlign = "center";
    ctx.fillStyle = menuTab === "CUBE" ? "#00CED1" : "#333";
    ctx.fillRect(350, 350, 100, 40);
    ctx.fillStyle = "#FFF"; ctx.font = "bold 14px Verdana"; ctx.fillText("CUBE", 400, 375);
    
    ctx.fillStyle = menuTab === "SHIP" ? "#FF00FF" : "#333";
    ctx.fillRect(470, 350, 100, 40);
    ctx.fillStyle = "#FFF"; ctx.fillText("SHIP", 520, 375);

    const list = menuTab === "CUBE" ? SKINS.CUBES : SKINS.SHIPS;
    const currentIdx = menuTab === "CUBE" ? cubeIdx : shipIdx;

    for(let i=0; i<list.length; i++) {
        let bx = 350 + (i * 60);
        let by = 410;
        if (i === currentIdx) {
            ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(bx-5, by-5, 60, 60);
        }
        ctx.fillStyle = list[i].color; ctx.fillRect(bx, by, 50, 50);
        ctx.fillStyle = list[i].eye; ctx.fillRect(bx+30, by+15, 10, 10);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
